<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>AudioCap recording pipeline</title>
  <desc>Source app, process tap, private aggregate device, IOProc, serial writer, CAF capture, stop and check, export, duration check; planned library and player, Hi-Res virtual output device and monitor.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b06000"/>
    </marker>
    <style>
      .t { font-size: 17px; font-weight: 600; fill: #202124; }
      .s { font-size: 13px; fill: #3c4043; }
      .h { font-size: 22px; font-weight: 700; fill: #202124; }
      .lane { paint-order: stroke; stroke: #ffffff; stroke-width: 8px; stroke-linejoin: round; font-size: 13px; font-weight: 600; fill: #5f6368; letter-spacing: 0.08em; }
      .up { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; }
      .eng { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
      .plan { fill: #fef7e0; stroke: #b06000; stroke-width: 2; stroke-dasharray: 7 5; }
      .a { stroke: #3c4043; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .ap { stroke: #b06000; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrowp); }
      .al { font-size: 12px; fill: #5f6368; }
    </style>
  </defs>
  <rect width="1240" height="720" fill="#ffffff"/>
  <text x="40" y="40" class="h">AudioCap recording pipeline</text>

  <!-- Row 0: Hi-Res virtual device (planned) -->
  <rect x="640" y="62" width="240" height="62" rx="10" class="plan"/>
  <text x="760" y="88" text-anchor="middle" class="t">AudioCap Hi-Res (PR 6)</text>
  <text x="760" y="110" text-anchor="middle" class="s">virtual output, 44.1–192 kHz</text>
  <path d="M760,124 L760,158" class="ap"/>
  <text x="772" y="146" class="al">clock + system output while recording</text>

  <!-- Row 1 -->
  <text x="40" y="154" class="lane">CAPTURE</text>
  <rect x="40" y="162" width="240" height="80" rx="10" class="up"/>
  <text x="160" y="196" text-anchor="middle" class="t">Source app</text>
  <text x="160" y="220" text-anchor="middle" class="s">Music, Spotify, a browser…</text>

  <rect x="340" y="162" width="240" height="80" rx="10" class="up"/>
  <text x="460" y="190" text-anchor="middle" class="t">Process tap</text>
  <text x="460" y="212" text-anchor="middle" class="s">CATapDescription</text>
  <text x="460" y="230" text-anchor="middle" class="s">AudioHardwareCreateProcessTap</text>

  <rect x="640" y="162" width="240" height="80" rx="10" class="up"/>
  <text x="760" y="190" text-anchor="middle" class="t">Private aggregate device</text>
  <text x="760" y="212" text-anchor="middle" class="s">tap as input stream</text>
  <text x="760" y="230" text-anchor="middle" class="s">clock = output device</text>

  <rect x="940" y="162" width="260" height="80" rx="10" class="eng"/>
  <text x="1070" y="190" text-anchor="middle" class="t">IOProc · IO queue</text>
  <text x="1070" y="212" text-anchor="middle" class="s">real time: copy into ring, signal</text>
  <text x="1070" y="230" text-anchor="middle" class="s">no allocation, locks or I/O</text>

  <path d="M280,202 L338,202" class="a"/>
  <path d="M580,202 L638,202" class="a"/>
  <path d="M880,202 L938,202" class="a"/>
  <path d="M1070,242 L1070,318" class="a"/>
  <text x="1080" y="286" class="al">hand-off</text>

  <!-- Row 2 (right to left) -->
  <text x="40" y="312" class="lane">WRITE AND EXPORT</text>
  <rect x="940" y="320" width="260" height="80" rx="10" class="eng"/>
  <text x="1070" y="348" text-anchor="middle" class="t">Serial writer queue</text>
  <text x="1070" y="370" text-anchor="middle" class="s">the only owner of the file</text>
  <text x="1070" y="388" text-anchor="middle" class="s">create · write · close</text>

  <rect x="640" y="320" width="240" height="80" rx="10" class="eng"/>
  <text x="760" y="352" text-anchor="middle" class="t">CAF capture</text>
  <text x="760" y="376" text-anchor="middle" class="s">Float32, lossless, tap rate</text>

  <rect x="340" y="320" width="240" height="80" rx="10" class="eng"/>
  <text x="460" y="348" text-anchor="middle" class="t">Stop: close + check</text>
  <text x="460" y="370" text-anchor="middle" class="s">AudioDeviceStop → drain</text>
  <text x="460" y="388" text-anchor="middle" class="s">→ close() → frames = header</text>

  <rect x="40" y="320" width="240" height="80" rx="10" class="eng"/>
  <text x="160" y="348" text-anchor="middle" class="t">Export</text>
  <text x="160" y="370" text-anchor="middle" class="s">WAV Float32 · FLAC 24-bit</text>
  <text x="160" y="388" text-anchor="middle" class="s">ALAC · AAC 256 (lossy)</text>

  <path d="M940,360 L882,360" class="a"/>
  <path d="M640,360 L582,360" class="a"/>
  <path d="M340,360 L282,360" class="a"/>

  <!-- Row 3 -->
  <path d="M160,400 L160,476" class="a"/>
  <text x="40" y="470" class="lane">VERIFY, PLAY, MONITOR</text>
  <rect x="40" y="478" width="240" height="80" rx="10" class="eng"/>
  <text x="160" y="506" text-anchor="middle" class="t">Duration check</text>
  <text x="160" y="528" text-anchor="middle" class="s">header frames =</text>
  <text x="160" y="546" text-anchor="middle" class="s">decoded frames</text>

  <path d="M280,518 L338,518" class="ap"/>
  <rect x="340" y="478" width="300" height="80" rx="10" class="plan"/>
  <text x="490" y="506" text-anchor="middle" class="t">Library + player (PR 4)</text>
  <text x="490" y="528" text-anchor="middle" class="s">conversion status, waveform, meter</text>
  <text x="490" y="546" text-anchor="middle" class="s">Quality panel · ~/Music/AudioCap</text>

  <path d="M1070,400 L1070,476" class="ap"/>
  <text x="1080" y="444" class="al">copy for listening</text>
  <rect x="940" y="478" width="260" height="80" rx="10" class="plan"/>
  <text x="1070" y="506" text-anchor="middle" class="t">Monitor (PR 6)</text>
  <text x="1070" y="528" text-anchor="middle" class="s">plays on the real speakers:</text>
  <text x="1070" y="546" text-anchor="middle" class="s">Bluetooth, display, built-in</text>

  <!-- Legend -->
  <line x1="40" y1="600" x2="1200" y2="600" stroke="#dadce0" stroke-width="1"/>
  <rect x="40" y="622" width="36" height="22" rx="5" class="up"/>
  <text x="86" y="638" class="s">CoreAudio setup (from upstream)</text>
  <rect x="330" y="622" width="36" height="22" rx="5" class="eng"/>
  <text x="376" y="638" class="s">recording engine (PR 1)</text>
  <rect x="580" y="622" width="36" height="22" rx="5" class="plan"/>
  <text x="626" y="638" class="s">planned</text>
  <text x="40" y="680" class="s">Only the monitor copy is resampled. The file keeps the rate the source app renders at, which is the clock device's rate.</text>
</svg>
